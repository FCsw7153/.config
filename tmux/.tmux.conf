# ==========================================
# Tmux 3.3a + VSCode 终极强制复制配置
# ==========================================

# 1. 基础设置
set -g mouse on
set -g mode-keys vi
set -g allow-passthrough on

# 2. 强制开启系统剪贴板支持
# 这里的 external 意为：使用外部终端的剪贴板
set -s set-clipboard on

# 3. 【关键】告诉 Tmux 如何发送剪贴板信号 (OSC 52)
# 很多时候 tmux 识别不出 VSCode 支持这个，所以我们要手动写死
set -as terminal-overrides ',*:Ms=\E]52;c;%p2%s\7'

# 4. 【关键】重新绑定鼠标松开事件
# 默认的 MouseDragEnd1Pane 可能只是退出了模式，没触发复制
# 这里我们强制它：选中结束 -> 复制到系统剪贴板 -> 取消选中
