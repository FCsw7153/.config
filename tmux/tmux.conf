# mouse 
set -g mouse on

# clipboard
set -g set-clipboard on 

# set prefix keybind
unbind C-b
set -g prefix C-a
bind C-a send-prefix


# split the window
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# pane change
bind h select-pane -L
bind l select-pane -R
bind j select-pane -D
bind k select-pane -U

# terminal color
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# auto rename window
set-option -g renumber-windows on

# ── 基础 ──────────────────────────────────────────
set -g base-index 1          # 窗口从 1 开始编号
set -g escape-time 0         # 消除 ESC 延迟（对 Neovim 重要）
set -g history-limit 10000

# ── Catppuccin Mocha 色板 ──────────────────────────
# base=#1e1e2e  surface0=#313244  overlay0=#6c7086
# text=#cdd6f4  mauve=#cba6f7     yellow=#f9e2af

# ── 状态栏 ────────────────────────────────────────
set -g status-position top
set -g status-interval 60
set -g status-style "bg=#1e1e2e,fg=#cdd6f4"

# 左：session 名
set -g status-left "#[bg=#cba6f7,fg=#1e1e2e,bold] #S #[bg=#1e1e2e] "
set -g status-left-length 30

# 右：时间
set -g status-right "#[fg=#6c7086] %H:%M "
set -g status-right-length 20

# 窗口标签
set -g window-status-format         "#[fg=#6c7086] #I #W "
set -g window-status-current-format "#[bg=#313244,fg=#cdd6f4,bold] #I #W "
set -g window-status-separator ""

# ── 窗格边框 ──────────────────────────────────────
set -g pane-border-style        "fg=#313244"
set -g pane-active-border-style "fg=#cba6f7"

# ── 其他 UI ───────────────────────────────────────
set -g message-style "bg=#313244,fg=#cdd6f4"
set -g mode-style    "bg=#cba6f7,fg=#1e1e2e"  # 复制模式选中色
