# mouse
set -g mouse on

# clipboard
set -g set-clipboard on

# set prefix keybind
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# split the window
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# pane change
bind h select-pane -L
bind l select-pane -R
bind j select-pane -D
bind k select-pane -U

# terminal color
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# auto rename window
set-option -g renumber-windows on

# ── 基础 ──────────────────────────────────────────
set -g base-index 1          # 窗口从 1 开始编号
set -g escape-time 0         # 消除 ESC 延迟（对 Neovim 重要）
set -g history-limit 10000

# display
set -g status-position bottom
set -g status-interval 10
set -g status-justify centre
set -g status-style "bg=default,fg=default"
# 左：session
set -g status-left "#[bg=default,bold][ #S ]"
set -g status-left-length 40
# 右：时间
set -g status-right "#[bold]%Y-%m-%d %H:%M "
set -g status-right-length 40
# 窗口标签
set -g window-status-format "#[bold] #I:#W "
set -g window-status-current-format "#[bold] #I:#W "
set -g window-status-current-style "bg=default,fg=#fb4934"
set -g window-status-separator ""
set -g window-status-activity-style none
# pane 边框尽量朴素
set -g pane-border-style "fg=colour238"
set -g pane-active-border-style "fg=#fb4934"
# message / copy mode 也改朴素一点
set -g message-style "bg=default,fg=default"
set -g mode-style "bg=colour238,fg=default"
